name: oficina-app

services:
  postgres:
    image: postgres:16-alpine
    container_name: oficina-postgres
    environment:
      POSTGRES_DB: oficina
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - oficina_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d oficina"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # SNS + SQS locais. Nao cria nada na subida: o MassTransit da API cria filas e
  # topicos (local-oficina-*) ao iniciar o bus.
  localstack:
    image: localstack/localstack:3.8.1
    container_name: oficina-localstack
    environment:
      SERVICES: sns,sqs
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: oficina-api
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=oficina;Username=${DB_USER};Password=${DB_PASSWORD}"
      Jwt__Secret: ${JWT_SECRET}
      # Contrato do token emitido pela funcao serverless oficina-auth-api; a API so
      # valida. (oficina-auth abaixo e o VALOR da claim iss, nao o nome do componente.)
      Jwt__Issuer: ${JWT_ISSUER:-oficina-auth}
      Jwt__Audience: ${JWT_AUDIENCE:-oficina-api}
      AdminBootstrap__Password: ${ADMIN_BOOTSTRAP_PASSWORD}
      # Agente APM do New Relic: instalado na imagem, mas inerte aqui porque
      # CORECLR_ENABLE_PROFILING=0 vem por padrao no Dockerfile. Quem liga o
      # profiling (=1) e o Deployment do Kubernetes, nao o compose local.
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
      NEW_RELIC_APP_NAME: ${NEW_RELIC_APP_NAME:-oficina-api}
      # Saga sobre SNS/SQS do LocalStack. Sem Billing e Execucao rodando, a OS
      # aberta fica em Recebida com o GerarOrcamento na fila do Billing; o
      # ambiente com os tres servicos e o docker-compose.fase4.yml.
      Mensageria__Transporte: AmazonSqs
      Mensageria__PrefixoAmbiente: local
      Mensageria__Regiao: us-east-1
      Mensageria__ServiceUrl: http://localstack:4566
      # Credenciais ficticias: o LocalStack nao valida, mas o SDK AWS exige alguma.
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # Ferramenta opcional para inspecionar o banco na demo: `docker compose --profile tools up adminer`
  adminer:
    image: adminer:4
    container_name: oficina-adminer
    profiles: ["tools"]
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oficina_pgdata:
