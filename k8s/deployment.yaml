apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: ${NAMESPACE}
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oficina-api
          # ${ECR_REPOSITORY} e ${IMAGE_TAG} são substituídos pelo CI antes do apply
          # (ex.: envsubst < k8s/deployment.yaml | kubectl apply -f -).
          image: "${ECR_REPOSITORY}:${IMAGE_TAG}"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          # Liga o agente do New Relic (já presente na imagem, desligado por padrão).
          # CORECLR_ENABLE_PROFILING=1 é o que ativa o profiler; sem isso a licença
          # não tem efeito nenhum. A licença vem do Secret oficina-api-secret, chave
          # NewRelic__LicenseKey (criado pelo CI de deploy).
          #
          # ${AMBIENTE} é "prd" ou "hml" (derivado da branch pelo cd.yml); ${NAMESPACE}
          # é "oficina-prd"/"oficina-hml". Os dois NÃO são intercambiáveis aqui:
          # "oficina-api-${NAMESPACE}" rendia "oficina-api-oficina-prd".
          env:
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            # Nome fixo, sem a lista "oficina-api;oficina-api-${AMBIENTE}" (recurso de
            # roll-up do agente .NET: até 3 nomes separados por ";", o primeiro é a
            # entidade principal). A sintaxe existe e foi verificada, mas por prudência
            # optou-se pelo nome simples: se a lista NÃO se comportar como documentado,
            # appName vira a string literal com ";" e os dois painéis obrigatórios e o
            # alerta Critical da Fase 3 (que procuram appName = 'oficina-api') deixam de
            # encontrar a aplicação — falha silenciosa, só visível na hora de mostrar o
            # dashboard. Com o nome fixo, quem separa hml de prd no APM é o
            # NEW_RELIC_LABELS abaixo (ambiente:${AMBIENTE}), que cobre a maior parte do
            # caso de uso. Quem reintroduzir a lista deve validar antes contra o New
            # Relic real (conta de hml, por exemplo) que ela realmente cria uma entidade
            # por ambiente sem quebrar appName = 'oficina-api'.
            - name: NEW_RELIC_APP_NAME
              value: "oficina-api"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: NewRelic__LicenseKey
            - name: NEW_RELIC_LABELS
              value: "ambiente:${AMBIENTE}"
            # readOnlyRootFilesystem: true + agente em /usr/local/newrelic-dotnet-agent:
            # por padrão o agente grava em $CORECLR_NEWRELIC_HOME/logs e o profiler
            # NATIVO grava seu próprio log ANTES de ler qualquer configuração gerenciada.
            # Nos dois casos o destino seria a raiz somente-leitura. O único ponto
            # gravável do pod é /tmp (emptyDir, abaixo), e é para lá que os dois vão.
            # Vale /tmp direto, e não um subdiretório: o profiler nativo falha ao abrir
            # o log se o diretório não existir, e falha de carga do profiler com
            # CORECLR_ENABLE_PROFILING=1 derruba o processo inteiro na inicialização.
            - name: NEW_RELIC_LOG_DIRECTORY
              value: "/tmp"
            - name: NEWRELIC_PROFILER_LOG_DIRECTORY
              value: "/tmp"
          # Memória dimensionada COM o agente APM ligado. O valor anterior (256Mi)
          # foi definido para a aplicação SEM agente. Medição desta imagem, em
          # repouso (sem tráfego), banco conectado, rootfs read-only:
          #   CORECLR_ENABLE_PROFILING=0 →  ~77Mi RSS
          #   CORECLR_ENABLE_PROFILING=1 → ~215Mi RSS   (+~140Mi de agente:
          #       profiler nativo + agente gerenciado + ~30 assemblies de
          #       instrumentação em extensions/ + buffers do harvest de 60s)
          # Ou seja: ligado o profiler, o pod já nasce a ~84% do limite antigo SEM
          # atender uma única requisição — qualquer carga o leva a OOMKill e ao laço
          # de restart do liveness probe. 512Mi ≈ 2,4x o repouso medido, margem que
          # o GC precisa para não coletar agressivamente junto ao limite. requests
          # sobe de 128Mi para 256Mi porque 128Mi era menos da metade do consumo
          # real: o scheduler empacotaria pods demais no nó e este seria candidato
          # precoce a despejo sob pressão de memória.
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # rootfs read-only → /tmp precisa ser gravável (arquivos temporários do .NET
            # e, desde a Fase 3, os logs do agente e do profiler do New Relic — ver
            # NEW_RELIC_LOG_DIRECTORY / NEWRELIC_PROFILER_LOG_DIRECTORY acima).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
