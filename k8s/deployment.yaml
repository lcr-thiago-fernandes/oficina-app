apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-api
  namespace: ${NAMESPACE}
  labels:
    app: oficina-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oficina-api
  template:
    metadata:
      labels:
        app: oficina-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oficina-api
          # ${ECR_REPOSITORY} e ${IMAGE_TAG} são substituídos pelo CI antes do apply
          # (ex.: envsubst < k8s/deployment.yaml | kubectl apply -f -).
          image: "${ECR_REPOSITORY}:${IMAGE_TAG}"
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: oficina-api-config
            - secretRef:
                name: oficina-api-secret
          # Liga o agente do New Relic (ja presente na imagem, desligado por padrao).
          # CORECLR_ENABLE_PROFILING=1 e o que ativa o profiler; sem isso a licenca
          # nao tem efeito nenhum. A licenca vem do Secret oficina-api-secret, chave
          # NewRelic__LicenseKey (criado pelo CI de deploy).
          env:
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: NEW_RELIC_APP_NAME
              value: "oficina-api-${NAMESPACE}"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: oficina-api-secret
                  key: NewRelic__LicenseKey
            - name: NEW_RELIC_LABELS
              value: "ambiente:${NAMESPACE}"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # rootfs read-only → /tmp precisa ser gravável (arquivos temporários do .NET).
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
