# ServiceAccount do pod da API com IRSA: a annotation faz o EKS injetar credenciais
# temporarias da role IAM do ambiente (SQS/SNS do bus). ${IRSA_ROLE_ARN} vem do SSM
# /oficina/os-service/<amb>/irsa_role_arn, lido pelo cd.yml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  namespace: ${NAMESPACE}
  labels:
    app: oficina-api
  annotations:
    eks.amazonaws.com/role-arn: "${IRSA_ROLE_ARN}"
