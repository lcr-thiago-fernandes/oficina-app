# TEMPLATE — NÃO CONTÉM SEGREDOS REAIS.
# No deploy real este Secret é criado pelo CD (cd.yml) a partir do AWS Secrets Manager
# (Jwt__Secret, senha do banco, licença do New Relic) e do SSM Parameter Store (endpoint
# do RDS), usando as credenciais OIDC assumidas no próprio pipeline — não mais a partir
# de GitHub Secrets nem de outputs do Terraform lidos diretamente pelo CI. Exemplo:
#   kubectl create secret generic oficina-api-secret -n ${NAMESPACE} \
#     --from-literal=Jwt__Secret="$JWT_SECRET" \
#     --from-literal=ConnectionStrings__Default="Host=$RDS_ENDPOINT;Port=5432;Database=oficina;Username=oficina_admin;Password=$DB_PASSWORD" \
#     --from-literal=AdminBootstrap__Password="$ADMIN_BOOTSTRAP_PASSWORD" \
#     --from-literal=Webhook__Token="$WEBHOOK_TOKEN" \
#     --from-literal=NewRelic__LicenseKey="$NR_KEY"
# ADMIN_BOOTSTRAP_PASSWORD e WEBHOOK_TOKEN continuam vindo de GitHub Secrets (não migraram
# para o Secrets Manager). Este arquivo serve apenas como contrato/documentação das
# chaves. NUNCA commitar valores reais.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-api-secret
  namespace: ${NAMESPACE}
  labels:
    app: oficina-api
type: Opaque
stringData:
  Jwt__Secret: "TROCAR_NO_DEPLOY_min_64_caracteres_aleatorios_para_HS256_xxxxxxxxxxxx"
  ConnectionStrings__Default: "Host=TROCAR_ENDPOINT_RDS;Port=5432;Database=oficina;Username=TROCAR_NO_DEPLOY;Password=TROCAR_NO_DEPLOY"
  AdminBootstrap__Password: "TROCAR_NO_DEPLOY"
  Webhook__Token: "TROCAR_NO_DEPLOY"
  # Consumida pelo Deployment via secretKeyRef (env NEW_RELIC_LICENSE_KEY). O nome da
  # chave precisa bater exatamente com o que o Deployment espera: NewRelic__LicenseKey.
  NewRelic__LicenseKey: "TROCAR_NO_DEPLOY"
