name: Dependency submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Restore gera obj/project.assets.json em cada projeto — a Component
      # Detection action le esse arquivo pra descobrir as transitivas.
      # Sem restore, ela so ve as PackageReference diretas no .csproj.
      - name: Restore (gera project.assets.json com a arvore completa)
        run: dotnet restore Oficina.sln

      - name: Submit NuGet dependencies (incl. transitive)
        uses: advanced-security/component-detection-dependency-submission-action@v0.0.2
