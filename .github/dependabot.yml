version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "nuget"
    # Global Constraints da Fase 4: MassTransit 8.5+ exige EF Core 9 (incompatível com Npgsql EF 8.0.10)
    # e 9.x é comercial; EF Core e Npgsql ficam em 8.x.
    ignore:
      - dependency-name: "MassTransit*"
        versions: [">= 8.5.0"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        versions: [">= 9.0.0"]
      - dependency-name: "Npgsql*"
        versions: [">= 9.0.0"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
